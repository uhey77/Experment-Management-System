[project]
name = "experiment-management-backend"
version = "0.1.0"
description = "Research lab experiment management backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.27.0",
  "sqlmodel>=0.0.14",
  "sqlalchemy>=2.0.29",
  "psycopg[binary]>=3.1.18",
  "alembic>=1.13.1",
  "pydantic-settings>=2.2.1",
  "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.5",
  "httpx>=0.27.0",
  "ruff>=0.4.2",
  "black>=24.4.2",
  "mypy>=1.9.0",
]

[build-system]
requires = ["setuptools>=68.2.2", "wheel>=0.41.2"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
